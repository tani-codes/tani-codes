<!-- BADGE 2 : 🎓 CGPA | 9.45 [CUMULATIVE] -->
<g filter="url(#bsh)">
  <rect x="345" y="62" width="270" height="46" rx="6" fill="#474747"/>
  <rect x="465" y="62" width="150" height="46" fill="#00A2E8" clip-path="url(#c2)"/>
  <text x="405" y="89" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">🎓 CGPA</text>
  <text x="540" y="90" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">9.45 [CUMULATIVE]</text>
</g>

<!-- BADGE 3 : 🧠 ML & DL | DEVELOPER -->
<g filter="url(#bsh)">
  <rect x="630" y="62" width="270" height="46" rx="6" fill="#474747"/>
  <rect x="760" y="62" width="140" height="46" fill="#9B59B6" clip-path="url(#c3)"/>
  <text x="695" y="89" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">🧠 ML &amp; DL</text>
  <text x="830" y="90" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">DEVELOPER</text>
</g>

