  <text x="445" y="90" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">9.45[CUMULATIVE]</text>
</g>

<!-- BADGE 3 : 🤖 AI & AUTOMATION | ENTHUSIAST -->
