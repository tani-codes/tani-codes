  <rect x="532" y="62" width="175" height="46" rx="6" fill="#474747"/>
  <rect x="614" y="62" width="93"  height="46" fill="#9B59B6" clip-path="url(#c3)"/>
  <text x="542" y="89" font-family="'Segoe UI',sans-serif" font-size="9.5" font-weight="700" fill="#FFF">🤖 AI &amp; AUTO</text>
  <text x="660" y="90" font-family="'Segoe UI',sans-serif" font-size="10" font-weight="800" fill="#FFF" text-anchor="middle">ENTHUSIAST</text>
</g>

