  <rect x="60" y="182" width="412" height="46" rx="6" fill="#474747"/>
  <rect x="235" y="182" width="237" height="46" fill="#E67E22" clip-path="url(#c6)"/>
  <text x="147" y="209" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">⚡ QA ANALYST</text>
  <text x="353" y="210" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">TESTING, UAT &amp; BRD/FRD</text>
</g>

<!-- BADGE 7 : 🚀 CURRENTLY | BUILDING ML & DL PROJECTS -->
<g filter="url(#bsh)">
