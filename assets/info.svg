<?xml version="1.0" encoding="UTF-8"?>
<!--
  info.svg — Spacious Tanish AI Laboratory Dashboard
  Theme: Dark AI Research Lab + Neural Network Visualization
  Palette: Deep Obsidian (#050816) · Neon Cyan (#00F5FF) · Electric Blue (#00D2FF) · Purple Glow (#8B6FE8) · Mint (#00FF88)
  Author: Tanish Bandodkar
-->
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460">

<defs>

  <!-- ── Deep Obsidian Canvas Background ── -->
  <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#050816"/>
    <stop offset="50%"  stop-color="#091026"/>
    <stop offset="100%" stop-color="#040612"/>
  </linearGradient>

  <!-- ── Electric Cyan / Purple Glow ── -->
  <linearGradient id="headerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#00F5FF"/>
    <stop offset="50%"  stop-color="#8B6FE8"/>
    <stop offset="100%" stop-color="#00D2FF"/>
  </linearGradient>

  <!-- ── Card Border Gradient ── -->
  <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#00F5FF" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#8B6FE8" stop-opacity="0.25"/>
  </linearGradient>

  <!-- ── Neon Glow Filters ── -->
  <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#00F5FF" flood-opacity="0.12"/>
  </filter>

</defs>

<!-- ══════════════════════════════════════════ -->
<!--  LABORATORY CANVAS BACKGROUND             -->
<!-- ══════════════════════════════════════════ -->
<rect width="860" height="460" fill="url(#labBg)" rx="18"/>
<rect width="858" height="458" x="1" y="1" rx="17" fill="none" stroke="#1E2A4A" stroke-width="1.5"/>

<!-- Tech Grid Pattern Overlay -->
<g stroke="#14213D" stroke-width="0.6" opacity="0.4">
  <line x1="0" y1="75"  x2="860" y2="75"/>
  <line x1="0" y1="175" x2="860" y2="175"/>
  <line x1="0" y1="275" x2="860" y2="275"/>
  <line x1="0" y1="375" x2="860" y2="375"/>
  <line x1="210" y1="0" x2="210" y2="460"/>
  <line x1="430" y1="0" x2="430" y2="460"/>
  <line x1="650" y1="0" x2="650" y2="460"/>
</g>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  NEURAL NETWORK CONNECTIONS & WATERMARK CODE IN BACKGROUND    -->
<!-- ══════════════════════════════════════════════════════════════ -->
<g stroke="#00D2FF" stroke-width="1" opacity="0.2">
  <line x1="120" y1="135" x2="380" y2="135" stroke-dasharray="4,4"/>
  <line x1="380" y1="135" x2="640" y2="135" stroke-dasharray="4,4"/>
  <line x1="170" y1="225" x2="430" y2="225" stroke-dasharray="4,4"/>
  <line x1="430" y1="225" x2="690" y2="225" stroke-dasharray="4,4"/>
</g>

<!-- Background Code Snippet Watermarks -->
<g font-family="'Courier New', Courier, monospace" font-size="11" fill="#00F5FF" opacity="0.10">
  <text x="35"  y="435">model.fit(X_train, y_train) // val_accuracy: 98.45%</text>
  <text x="520" y="435">predict_pipeline() --batch-size 64 --status: active</text>
</g>

<!-- Floating Synapse Particles -->
<circle cx="120" cy="135" r="3" fill="#00F5FF" filter="url(#cyanGlow)">
  <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="380" cy="135" r="3.5" fill="#8B6FE8" filter="url(#cyanGlow)">
  <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
</circle>
<circle cx="640" cy="135" r="3" fill="#00D2FF" filter="url(#cyanGlow)">
  <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/>
</circle>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  HEADER PANEL — TANISH AI LAB SYSTEM ONLINE                    -->
<!-- ══════════════════════════════════════════════════════════════ -->
<g transform="translate(50, 22)">
  <!-- Outer Header Frame -->
  <rect width="760" height="54" rx="12" fill="#0B132B" stroke="url(#borderGlow)" stroke-width="1.2" filter="url(#cardShadow)"/>
  
  <!-- Corner Tech Accent Lines -->
  <path d="M10,0 L25,0 M0,10 L0,25" stroke="#00F5FF" stroke-width="2" fill="none"/>
  <path d="M750,0 L735,0 M760,10 L760,25" stroke="#00F5FF" stroke-width="2" fill="none"/>
  
  <!-- Header Text -->
  <text x="25" y="25" font-family="'Courier New', monospace" font-size="15" font-weight="800" fill="#00F5FF" letter-spacing="1.5">
    🧬 TANISH AI LAB <tspan fill="#8B6FE8">v2.0</tspan>
  </text>
  
  <text x="25" y="42" font-family="'Courier New', monospace" font-size="10" font-weight="600" fill="#7E8B9B" letter-spacing="1">
    SYSTEM ONLINE // AI RESEARCH &amp; DATA ENGINE
  </text>
  
  <!-- Blinking Status Indicator -->
  <g transform="translate(525, 15)">
    <rect width="220" height="25" rx="7" fill="#05261E" stroke="#00FF88" stroke-width="0.8"/>
    <circle cx="14" cy="13" r="4" fill="#00FF88">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" fill="#00FF88" letter-spacing="0.8">
      STATUS: BUILDING AI SYSTEMS
    </text>
  </g>
</g>

