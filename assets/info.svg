<?xml version="1.0" encoding="UTF-8"?>
<!--
  info.svg — Tanish AI Laboratory Dashboard
  Theme: Dark AI Research Lab + Neural Network Visualization
  Palette: Deep Obsidian (#050816) · Neon Cyan (#00F5FF) · Electric Blue (#00D2FF) · Purple Glow (#8B6FE8) · Mint (#00FF88)
  Author: Tanish Bandodkar
-->
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">

<defs>

  <!-- ── Deep Obsidian Canvas Background ── -->
  <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#050816"/>
    <stop offset="50%"  stop-color="#091026"/>
    <stop offset="100%" stop-color="#040612"/>
  </linearGradient>

  <!-- ── Electric Cyan / Purple Glow ── -->
  <linearGradient id="headerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#00F5FF"/>
    <stop offset="50%"  stop-color="#8B6FE8"/>
    <stop offset="100%" stop-color="#00D2FF"/>
  </linearGradient>

  <!-- ── Card Border Gradient ── -->
  <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#00F5FF" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#8B6FE8" stop-opacity="0.3"/>
  </linearGradient>

  <!-- ── Neon Glow Filters ── -->
  <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F5FF" flood-opacity="0.15"/>
  </filter>

  <!-- ── Clip Paths for Cards ── -->
  <clipPath id="cp1"><rect x="50"  y="90"  width="240" height="65" rx="10"/></clipPath>
  <clipPath id="cp2"><rect x="310" y="90"  width="240" height="65" rx="10"/></clipPath>
  <clipPath id="cp3"><rect x="570" y="90"  width="240" height="65" rx="10"/></clipPath>
  <clipPath id="cp4"><rect x="50"  y="170" width="240" height="65" rx="10"/></clipPath>
  <clipPath id="cp5"><rect x="310" y="170" width="240" height="65" rx="10"/></clipPath>
  <clipPath id="cp6"><rect x="570" y="170" width="240" height="65" rx="10"/></clipPath>
  <clipPath id="cp7"><rect x="50"  y="250" width="370" height="65" rx="10"/></clipPath>

</defs>

<!-- ══════════════════════════════════════════ -->
<!--  LABORATORY CANVAS BACKGROUND             -->
<!-- ══════════════════════════════════════════ -->
<rect width="860" height="420" fill="url(#labBg)" rx="16"/>
<rect width="858" height="418" x="1" y="1" rx="15" fill="none" stroke="#1E2A4A" stroke-width="1.5"/>

<!-- Tech Grid Pattern Overlay -->
<g stroke="#14213D" stroke-width="0.6" opacity="0.45">
  <line x1="0" y1="60"  x2="860" y2="60"/>
  <line x1="0" y1="160" x2="860" y2="160"/>
  <line x1="0" y1="260" x2="860" y2="260"/>
  <line x1="0" y1="360" x2="860" y2="360"/>
  <line x1="200" y1="0" x2="200" y2="420"/>
  <line x1="430" y1="0" x2="430" y2="420"/>
  <line x1="660" y1="0" x2="660" y2="420"/>
</g>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  NEURAL NETWORK CONNECTIONS & WATERMARK CODE IN BACKGROUND    -->
<!-- ══════════════════════════════════════════════════════════════ -->
<g stroke="#00D2FF" stroke-width="1" opacity="0.25">
  <line x1="120" y1="120" x2="380" y2="120" stroke-dasharray="4,4"/>
  <line x1="380" y1="120" x2="640" y2="120" stroke-dasharray="4,4"/>
  <line x1="170" y1="200" x2="430" y2="200" stroke-dasharray="4,4"/>
  <line x1="430" y1="200" x2="690" y2="200" stroke-dasharray="4,4"/>
</g>

<!-- Background Code Snippet Watermarks -->
<g font-family="'Courier New', Courier, monospace" font-size="11" fill="#00F5FF" opacity="0.12">
  <text x="30"  y="395">model.fit(X_train, y_train) // val_accuracy: 98.45%</text>
  <text x="540" y="395">predict_pipeline() --batch-size 64 --status: active</text>
  <text x="680" y="35">tensor.cuda() :: ON</text>
</g>

<!-- Floating Synapse Particles -->
<circle cx="120" cy="120" r="3" fill="#00F5FF" filter="url(#cyanGlow)">
  <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="380" cy="120" r="3.5" fill="#8B6FE8" filter="url(#cyanGlow)">
  <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
</circle>
<circle cx="640" cy="120" r="3" fill="#00D2FF" filter="url(#cyanGlow)">
  <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/>
</circle>
<circle cx="430" cy="200" r="3" fill="#00FF88" filter="url(#cyanGlow)">
  <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
</circle>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  HEADER PANEL — TANISH AI LAB SYSTEM ONLINE                    -->
<!-- ══════════════════════════════════════════════════════════════ -->
<g transform="translate(50, 18)">
  <!-- Outer Header Frame -->
  <rect width="760" height="52" rx="10" fill="#0B132B" stroke="url(#borderGlow)" stroke-width="1.2" filter="url(#cardShadow)"/>
  
  <!-- Corner Tech Accent Lines -->
  <path d="M10,0 L25,0 M0,10 L0,25" stroke="#00F5FF" stroke-width="2" fill="none"/>
  <path d="M750,0 L735,0 M760,10 L760,25" stroke="#00F5FF" stroke-width="2" fill="none"/>
  
  <!-- Header Text -->
  <text x="25" y="24" font-family="'Courier New', monospace" font-size="15" font-weight="800" fill="#00F5FF" letter-spacing="1.5">
    🧬 TANISH AI LAB <tspan fill="#8B6FE8">v2.0</tspan>
  </text>
  
  <text x="25" y="41" font-family="'Courier New', monospace" font-size="10" font-weight="600" fill="#7E8B9B" letter-spacing="1">
    SYSTEM ONLINE // AI RESEARCH &amp; DATA ENGINE
  </text>
  
  <!-- Blinking Status Indicator -->
  <g transform="translate(530, 20)">
    <rect width="215" height="24" rx="6" fill="#05261E" stroke="#00FF88" stroke-width="0.8"/>
    <circle cx="14" cy="12" r="4" fill="#00FF88">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="16" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" fill="#00FF88" letter-spacing="0.8">
      STATUS: BUILDING AI SYSTEMS
    </text>
  </g>
</g>

