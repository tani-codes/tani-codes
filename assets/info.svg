  <text x="353" y="149" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">PYTHON | TABLEAU | SQL</text>
</g>

<!-- BADGE 5 : 💻 OPEN TO | COLLABORATE -->
