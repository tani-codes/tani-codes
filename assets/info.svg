<?xml version="1.0" encoding="UTF-8"?>
<!--
  info.svg — Wide High-Contrast Profile Matrix Section
  Theme: Ultra-clean dark obsidian backdrop · Widescreen high-impact badges
  Author: Tanish Bandodkar
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">

<defs>

  <!-- ── Dark Background Gradient ── -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#0B0F19"/>
    <stop offset="100%" stop-color="#050811"/>
  </linearGradient>

  <!-- ── Badge Drop Shadow ── -->
  <filter id="bsh" x="-20%" y="-35%" width="150%" height="200%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
  </filter>

  <!-- ── Neon Glow Filter ── -->
  <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- ══════════════════════════════════════════════════════════
       Typewriter single-line cycling commands clip paths
       ══════════════════════════════════════════════════════════ -->
  <clipPath id="tClip1">
    <rect x="440" y="16" width="0" height="28">
      <animate attributeName="width"
        values="0; 400; 400; 0; 0"
        keyTimes="0; 0.053; 0.173; 0.190; 1"
        dur="15s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <clipPath id="tClip2">
    <rect x="440" y="16" width="0" height="28">
      <animate attributeName="width"
        values="0; 0; 400; 400; 0; 0"
        keyTimes="0; 0.200; 0.253; 0.373; 0.390; 1"
        dur="15s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <clipPath id="tClip3">
    <rect x="440" y="16" width="0" height="28">
      <animate attributeName="width"
        values="0; 0; 400; 400; 0; 0"
        keyTimes="0; 0.400; 0.453; 0.573; 0.590; 1"
        dur="15s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <clipPath id="tClip4">
    <rect x="440" y="16" width="0" height="28">
      <animate attributeName="width"
        values="0; 0; 400; 400; 0; 0"
        keyTimes="0; 0.600; 0.653; 0.773; 0.790; 1"
        dur="15s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <clipPath id="tClip5">
    <rect x="440" y="16" width="0" height="28">
      <animate attributeName="width"
        values="0; 0; 400; 400; 0; 0"
        keyTimes="0; 0.800; 0.853; 0.973; 0.990; 1"
        dur="15s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <!-- ══════════════════════════════════════════════════════════
       Clip paths — Widescreen Badge Rows
       ══════════════════════════════════════════════════════════ -->
  <clipPath id="c1"><rect x="60" y="60" width="330" height="48" rx="8"/></clipPath>
  <clipPath id="c2"><rect x="420" y="60" width="360" height="48" rx="8"/></clipPath>
  <clipPath id="c3"><rect x="810" y="60" width="330" height="48" rx="8"/></clipPath>

  <clipPath id="c4"><rect x="60" y="120" width="525" height="48" rx="8"/></clipPath>
  <clipPath id="c5"><rect x="615" y="120" width="525" height="48" rx="8"/></clipPath>

  <clipPath id="c6"><rect x="60" y="180" width="525" height="48" rx="8"/></clipPath>
  <clipPath id="c7"><rect x="615" y="180" width="525" height="48" rx="8"/></clipPath>

</defs>

<!-- ══════════════════════════════════════════ -->
<!--  BACKGROUND CANVAS                         -->
<!-- ══════════════════════════════════════════ -->
<rect width="1200" height="340" fill="url(#bg)" rx="16"/>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  CYCLING COMMAND LINE PROMPT — CENTERED TYPEWRITER             -->
<!-- ══════════════════════════════════════════════════════════════ -->

<!-- ── 1/5 > python tanish.py ── -->
<text x="600" y="38" text-anchor="middle" font-family="'Courier New', Courier, monospace"
      font-size="17" font-weight="700" clip-path="url(#tClip1)" opacity="0">
  <tspan fill="#00F5FF">&gt; python tanish.py</tspan>
  <tspan fill="#00F5FF" font-weight="700"> ▋<animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></tspan>
  <animate attributeName="opacity"
    values="1;1;1;0;0"
    keyTimes="0;0.053;0.173;0.190;1"
    dur="15s" begin="0s" repeatCount="indefinite"/>
</text>

<!-- ── 2/5 loading profile... ✓ done ── -->
<text x="600" y="38" text-anchor="middle" font-family="'Courier New', Courier, monospace"
      font-size="17" font-weight="700" clip-path="url(#tClip2)" opacity="0">
  <tspan fill="#8B6FE8">loading profile</tspan><tspan fill="#7E8B9B">...</tspan><tspan fill="#00FF88" font-weight="700">  ✓  done</tspan>
  <tspan fill="#00FF88" font-weight="700"> ▋<animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></tspan>
  <animate attributeName="opacity"
    values="0;1;1;1;0;0"
    keyTimes="0;0.200;0.253;0.373;0.390;1"
    dur="15s" begin="0s" repeatCount="indefinite"/>
</text>

<!-- ── 3/5 executing data pipeline... 100% ── -->
<text x="600" y="38" text-anchor="middle" font-family="'Courier New', Courier, monospace"
      font-size="17" font-weight="700" clip-path="url(#tClip3)" opacity="0">
  <tspan fill="#FF9F43">executing pipeline</tspan><tspan fill="#7E8B9B">...</tspan><tspan fill="#00F5FF" font-weight="700">  ██████  100%</tspan>
  <tspan fill="#00F5FF" font-weight="700"> ▋<animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></tspan>
  <animate attributeName="opacity"
    values="0;1;1;1;0;0"
    keyTimes="0;0.400;0.453;0.573;0.590;1"
    dur="15s" begin="0s" repeatCount="indefinite"/>
</text>

<!-- ── 4/5 initializing AI stack... ✓ ready ── -->
<text x="600" y="38" text-anchor="middle" font-family="'Courier New', Courier, monospace"
      font-size="17" font-weight="700" clip-path="url(#tClip4)" opacity="0">
  <tspan fill="#7C6AF7">initializing stack</tspan><tspan fill="#7E8B9B">...</tspan><tspan fill="#00FF88" font-weight="700">  ✓  ready</tspan>
  <tspan fill="#00FF88" font-weight="700"> ▋<animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></tspan>
  <animate attributeName="opacity"
    values="0;1;1;1;0;0"
    keyTimes="0;0.600;0.653;0.773;0.790;1"
    dur="15s" begin="0s" repeatCount="indefinite"/>
</text>

<!-- ── 5/5 ready to collaborate! 🚀 ── -->
<text x="600" y="38" text-anchor="middle" font-family="'Courier New', Courier, monospace"
      font-size="17" font-weight="700" clip-path="url(#tClip5)" opacity="0">
  <tspan fill="#00FF88">ready to collaborate</tspan><tspan fill="#00FF88" font-weight="700">  🚀</tspan>
  <tspan fill="#00FF88" font-weight="700"> ▋<animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></tspan>
  <animate attributeName="opacity"
    values="0;1;1;1;0;0"
    keyTimes="0;0.800;0.853;0.973;0.990;1"
    dur="15s" begin="0s" repeatCount="indefinite"/>
</text>


