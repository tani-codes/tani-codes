  <rect x="488" y="122" width="412" height="46" rx="6" fill="#474747"/>
  <rect x="648" y="122" width="252" height="46" fill="#2ECC71" clip-path="url(#c5)"/>
  <text x="568" y="149" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">💻 OPEN TO</text>
  <text x="774" y="150" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">COLLABORATION &amp; ROLES</text>
</g>

<!-- ══════════════════════════════════════════════════════════ -->
<!--  ROW 3  —  2 Equal 412px Boxes                             -->
