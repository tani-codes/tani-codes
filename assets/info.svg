<?xml version="1.0" encoding="UTF-8"?>
<!--
  info.svg — Uniform Profile Matrix Section
  Theme: Balanced 960px canvas · Uniform box dimensions, corner radius & high-contrast styling
  Author: Tanish Bandodkar
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="340" viewBox="0 0 960 340">

<defs>

  <!-- ── Dark Background Gradient ── -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#0B0F19"/>
    <stop offset="100%" stop-color="#050811"/>
  </linearGradient>

  <!-- ── Badge Drop Shadow (Applied Uniformly to All Boxes) ── -->
  <filter id="bsh" x="-20%" y="-35%" width="150%" height="200%">
    <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.45"/>
  </filter>

  <!-- ══════════════════════════════════════════════════════════
       Typewriter single-line cycling commands clip paths
       ══════════════════════════════════════════════════════════ -->
  <clipPath id="tClip1">
    <rect x="320" y="16" width="0" height="26">
      <animate attributeName="width"
        values="0; 320; 320; 0; 0"
        keyTimes="0; 0.053; 0.173; 0.190; 1"
        dur="15s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <clipPath id="tClip2">
    <rect x="320" y="16" width="0" height="26">
      <animate attributeName="width"
        values="0; 0; 320; 320; 0; 0"
        keyTimes="0; 0.200; 0.253; 0.373; 0.390; 1"
        dur="15s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <clipPath id="tClip3">
    <rect x="320" y="16" width="0" height="26">
      <animate attributeName="width"
        values="0; 0; 320; 320; 0; 0"
        keyTimes="0; 0.400; 0.453; 0.573; 0.590; 1"
        dur="15s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <clipPath id="tClip4">
    <rect x="320" y="16" width="0" height="26">
      <animate attributeName="width"
        values="0; 0; 320; 320; 0; 0"
        keyTimes="0; 0.600; 0.653; 0.773; 0.790; 1"
        dur="15s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <clipPath id="tClip5">
    <rect x="320" y="16" width="0" height="26">
      <animate attributeName="width"
        values="0; 0; 320; 320; 0; 0"
        keyTimes="0; 0.800; 0.853; 0.973; 0.990; 1"
        dur="15s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <!-- ══════════════════════════════════════════════════════════
       Clip paths — Badge Rows (Exact Matching Rx=6 and Height=46)
       ══════════════════════════════════════════════════════════ -->
  <clipPath id="c1"><rect x="60"  y="62" width="270" height="46" rx="6"/></clipPath>
  <clipPath id="c2"><rect x="345" y="62" width="270" height="46" rx="6"/></clipPath>
  <clipPath id="c3"><rect x="630" y="62" width="270" height="46" rx="6"/></clipPath>

  <clipPath id="c4"><rect x="60"  y="122" width="412" height="46" rx="6"/></clipPath>
  <clipPath id="c5"><rect x="488" y="122" width="412" height="46" rx="6"/></clipPath>

  <clipPath id="c6"><rect x="60"  y="182" width="412" height="46" rx="6"/></clipPath>
  <clipPath id="c7"><rect x="488" y="182" width="412" height="46" rx="6"/></clipPath>

</defs>

<!-- ══════════════════════════════════════════ -->
<!--  BACKGROUND CANVAS                         -->
<!-- ══════════════════════════════════════════ -->
<rect width="960" height="340" fill="url(#bg)" rx="16"/>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  CYCLING COMMAND LINE PROMPT — CENTERED TYPEWRITER             -->
<!-- ══════════════════════════════════════════════════════════════ -->

<!-- ── 1/5 > python tanish.py ── -->
<text x="480" y="36" text-anchor="middle" font-family="'Courier New', Courier, monospace"
      font-size="16" font-weight="700" clip-path="url(#tClip1)" opacity="0">
  <tspan fill="#00F5FF">&gt; python tanish.py</tspan>
  <tspan fill="#00F5FF" font-weight="700"> ▋<animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></tspan>
  <animate attributeName="opacity"
    values="1;1;1;0;0"
    keyTimes="0;0.053;0.173;0.190;1"
    dur="15s" begin="0s" repeatCount="indefinite"/>
</text>

<!-- ── 2/5 loading profile... ✓ done ── -->
<text x="480" y="36" text-anchor="middle" font-family="'Courier New', Courier, monospace"
      font-size="16" font-weight="700" clip-path="url(#tClip2)" opacity="0">
  <tspan fill="#8B6FE8">loading profile</tspan><tspan fill="#7E8B9B">...</tspan><tspan fill="#00FF88" font-weight="700">  ✓  done</tspan>
  <tspan fill="#00FF88" font-weight="700"> ▋<animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></tspan>
  <animate attributeName="opacity"
    values="0;1;1;1;0;0"
    keyTimes="0;0.200;0.253;0.373;0.390;1"
    dur="15s" begin="0s" repeatCount="indefinite"/>
</text>

<!-- ── 3/5 executing data pipeline... 100% ── -->
<text x="480" y="36" text-anchor="middle" font-family="'Courier New', Courier, monospace"
      font-size="16" font-weight="700" clip-path="url(#tClip3)" opacity="0">
  <tspan fill="#FF9F43">executing pipeline</tspan><tspan fill="#7E8B9B">...</tspan><tspan fill="#00F5FF" font-weight="700">  ██████  100%</tspan>
  <tspan fill="#00F5FF" font-weight="700"> ▋<animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></tspan>
  <animate attributeName="opacity"
    values="0;1;1;1;0;0"
    keyTimes="0;0.400;0.453;0.573;0.590;1"
    dur="15s" begin="0s" repeatCount="indefinite"/>
</text>

<!-- ── 4/5 initializing AI stack... ✓ ready ── -->
<text x="480" y="36" text-anchor="middle" font-family="'Courier New', Courier, monospace"
      font-size="16" font-weight="700" clip-path="url(#tClip4)" opacity="0">
  <tspan fill="#7C6AF7">initializing stack</tspan><tspan fill="#7E8B9B">...</tspan><tspan fill="#00FF88" font-weight="700">  ✓  ready</tspan>
  <tspan fill="#00FF88" font-weight="700"> ▋<animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></tspan>
  <animate attributeName="opacity"
    values="0;1;1;1;0;0"
    keyTimes="0;0.600;0.653;0.773;0.790;1"
    dur="15s" begin="0s" repeatCount="indefinite"/>
</text>

<!-- ── 5/5 ready to collaborate! 🚀 ── -->
<text x="480" y="36" text-anchor="middle" font-family="'Courier New', Courier, monospace"
      font-size="16" font-weight="700" clip-path="url(#tClip5)" opacity="0">
  <tspan fill="#00FF88">ready to collaborate</tspan><tspan fill="#00FF88" font-weight="700">  🚀</tspan>
  <tspan fill="#00FF88" font-weight="700"> ▋<animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></tspan>
  <animate attributeName="opacity"
    values="0;1;1;1;0;0"
    keyTimes="0;0.800;0.853;0.973;0.990;1"
    dur="15s" begin="0s" repeatCount="indefinite"/>
</text>


<!-- ══════════════════════════════════════════════════════════ -->
<!--  ROW 1  —  3 Equal 270px Boxes                             -->
<!-- ══════════════════════════════════════════════════════════ -->

