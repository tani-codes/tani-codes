  <rect x="648" y="182" width="252" height="46" fill="#8E44AD" clip-path="url(#c7)"/>
  <text x="568" y="209" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">🚀 CURRENTLY</text>
  <text x="774" y="210" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">BUILDING ML &amp; DL PROJECTS</text>
</g>

