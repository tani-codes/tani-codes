<!-- ================================= -->
<!-- PENCIL WRITING ANIMATION -->
<!-- ================================= -->

<!--
  The pencil group origin = the TIP of the pencil.
  translate(x, y) moves the tip to absolute SVG coordinates (x, y).

  Timeline (all values in seconds):
    t=0.3   tip at (510, 155)   — start of "Tanish Bandodkar"
    t=6.3   tip at (930, 155)   — end of "Tanish Bandodkar"   (+420 px in 6 s)
    t=6.3   tip jumps to (510, 210) — start of "DATA ANALYTICS"
    t=6.8   tip at (510, 210)   — tiny pause / re-position
    t=10.8  tip at (770, 210)   — end of "DATA ANALYTICS"     (+260 px in 4 s)
    t=10.8  tip jumps to (510, 255) — start of "AI / ML…"
    t=11.3  tip at (510, 255)   — tiny pause / re-position
    t=15.3  tip at (840, 255)   — end of "AI / ML ENTHUSIAST" (+330 px in 4 s)
    t=15.3  tip jumps to (510, 300) — start of "SOFTWARE DEVELOPER"
    t=15.8  tip at (510, 300)   — tiny pause / re-position
    t=20.8  tip at (890, 300)   — end of "SOFTWARE DEVELOPER" (+380 px in 5 s)

  We express all this within a single animateTransform on dur="21s"
  (total = 20.8 s rounded up with a small hold).

  keyTimes are fractions of 21 s:
    0.3/21  = 0.0143  → writing line 1 starts
    6.3/21  = 0.3000  → writing line 1 ends
    6.3/21  = 0.3000  → jump (same keyTime, instant)
    6.8/21  = 0.3238  → arrive at line 2 start
    10.8/21 = 0.5143  → writing line 2 ends
    10.8/21 = 0.5143  → jump
    11.3/21 = 0.5381  → arrive at line 3 start
    15.3/21 = 0.7286  → writing line 3 ends
    15.3/21 = 0.7286  → jump
    15.8/21 = 0.7524  → arrive at line 4 start
    20.8/21 = 0.9905  → writing line 4 ends
    1.0000           → hold

  Because SVG animateTransform can't repeat a keyTime, we use calcMode="linear"
  and tiny epsilon offsets (0.0001) for instant jumps.
-->

<g>

  <animateTransform
    attributeName="transform"
    type="translate"
    calcMode="linear"
    values="
      510 155;
      510 155;
      930 155;
      510 210;
      510 210;
      770 210;
      510 255;
      510 255;
      840 255;
      510 300;
      510 300;
      890 300;
      890 300
    "
    keyTimes="
      0;
      0.0143;
      0.3000;
      0.3001;
      0.3238;
      0.5143;
      0.5144;
      0.5381;
      0.7286;
      0.7287;
      0.7524;
      0.9905;
      1
    "
    dur="21s"
    fill="freeze"/>


  <!-- PENCIL -->

  <g transform="rotate(-25)">



    <!-- TIP -->

    <polygon

    points="0,0 22,-8 22,8"

    fill="#333"/>



    <!-- WOOD -->

    <polygon

    points="22,-8 48,-8 48,8 22,8"

    fill="#C49A6A"/>



    <!-- BODY -->

    <rect

    x="48"

    y="-8"

    width="125"

    height="16"

    rx="8"

    fill="#F4C95D"/>



    <!-- METAL -->

    <rect

    x="173"

    y="-8"

    width="8"

    height="16"

    fill="#B8B8B8"/>



    <!-- ERASER -->

    <rect

    x="181"

    y="-8"

    width="22"

    height="16"

    rx="4"

    fill="#E57C7C"/>


  </g>


</g>
