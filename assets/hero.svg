</g>
<!-- ================================= -->
<!-- WRITING PENCIL ANIMATION -->
<!-- ================================= -->


<g>


<!-- PENCIL PATH -->

<animateTransform

attributeName="transform"

type="translate"

values="

500 145;

850 145;

500 205;

760 205;

500 245;

830 245;

500 285;

880 285

"

