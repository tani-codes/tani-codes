<?xml version="1.0" encoding="UTF-8"?>
<!--
  hero.svg — Tanish Bandodkar Profile Banner
  Theme: Deep Space & Cyber Obsidian Gradient (Inspired by Niharika/Aryan Hero)
  Author: Tanish Bandodkar
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">

<defs>

  <!-- ── Deep Space & Cyber Obsidian Background Gradient ── -->
  <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#080E24"/>
    <stop offset="45%"  stop-color="#160C2E"/>
    <stop offset="85%"  stop-color="#2D114D"/>
    <stop offset="100%" stop-color="#050816"/>
  </linearGradient>

  <!-- ── White Name Glow ── -->
  <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- ── Moon Glow ── -->
  <filter id="moonGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="15" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- ══════════════════════════════════════════ -->
<!--  BACKGROUND CANVAS                         -->
<!-- ══════════════════════════════════════════ -->
<rect width="1600" height="460" fill="url(#heroGradient)" rx="16"/>

<!-- Starry Sky Particles -->
<g fill="#FFF">
  <circle cx="120"  cy="80"  r="1.5" opacity="0.8"/>
  <circle cx="340"  cy="140" r="2"   opacity="0.6"/>
  <circle cx="560"  cy="60"  r="1.2" opacity="0.9"/>
  <circle cx="890"  cy="110" r="1.8" opacity="0.7"/>
  <circle cx="1120" cy="70"  r="2.2" opacity="0.8"/>
  <circle cx="1450" cy="130" r="1.5" opacity="0.9"/>
  <circle cx="220"  cy="320" r="2"   opacity="0.5"/>
  <circle cx="480"  cy="380" r="1.2" opacity="0.7"/>
  <circle cx="950"  cy="350" r="1.6" opacity="0.6"/>
  <circle cx="1380" cy="390" r="2"   opacity="0.8"/>
</g>

<!-- Glowing Celestial Orb / Moon (Top Right) -->
<circle cx="1320" cy="110" r="55" fill="#FFFFFF" opacity="0.92" filter="url(#moonGlow)"/>

<!-- Shooting Star Beam -->
<line x1="450" y1="90" x2="680" y2="160" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

<!-- ══════════════════════════════════════════ -->
<!--  HERO TEXT CONTENT (CENTERED & BOLD)        -->
<!-- ══════════════════════════════════════════ -->

<!-- Main Name -->
<text x="800" y="210"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="68" font-weight="900"
      fill="#FFFFFF" text-anchor="middle"
      letter-spacing="4" filter="url(#whiteGlow)">
  TANISH BANDODKAR
</text>

<!-- Subtitle 1: Roles -->
<text x="800" y="280"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="25" font-weight="700"
      fill="#E2D4FF" text-anchor="middle"
      letter-spacing="1">
  Data Analyst <tspan fill="#00F5FF">•</tspan> AI &amp; Automations Enthusiast <tspan fill="#00F5FF">•</tspan> Software Engineer
</text>

<!-- Subtitle 2: Tagline -->
<text x="800" y="325"
      font-family="'Courier New', Courier, monospace"
      font-size="16" font-style="italic"
      fill="#A894E6" text-anchor="middle"
      letter-spacing="1.5">
  Building Intelligent Solutions &amp; Data-Driven Workflows.
</text>

<!-- Bottom Subtle Wavy Curve -->
<path d="M0,420 Q400,450 800,420 Q1200,390 1600,420 L1600,460 L0,460 Z" fill="#0A0618" opacity="0.8"/>

</svg>