<circle cx="55" cy="35" r="8" fill="white"/>
<circle cx="120" cy="0" r="12" fill="#6BA368"/>

</g>



<!-- GRAPH -->

<g transform="translate(870 300)">

<line x1="0" y1="60" x2="180" y2="60"
