<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
width="1600"
height="500"
viewBox="0 0 1600 500">


<defs>

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#FFFDF8"/>
<stop offset="100%" stop-color="#F3EBDD"/>

</linearGradient>


<filter id="shadow">

<feGaussianBlur stdDeviation="12"/>

</filter>



<!-- TEXT REVEAL -->

<clipPath id="nameClip">

<rect x="500" y="115" width="0" height="60">

<animate
attributeName="width"
from="0"
to="430"
begin="1s"
dur="3s"
fill="freeze"/>

</rect>

</clipPath>


<clipPath id="dataClip">

<rect x="500" y="190" width="0" height="45">

<animate
attributeName="width"
from="0"
to="260"
begin="5s"
dur="2s"
fill="freeze"/>

</rect>

</clipPath>


<clipPath id="aiClip">

<rect x="500" y="235" width="0" height="45">

<animate
attributeName="width"
from="0"
to="300"
begin="8s"
dur="2s"
fill="freeze"/>

</rect>

</clipPath>


<clipPath id="devClip">

<rect x="500" y="280" width="0" height="45">

<animate
attributeName="width"
from="0"
to="340"
begin="11s"
dur="2s"
fill="freeze"/>

</rect>

</clipPath>


</defs>



<!-- BACKGROUND -->

<rect
width="1600"
height="500"
fill="url(#bg)"/>



<!-- NOTEBOOK SHADOW -->

<rect
x="330"
y="40"
width="950"
height="390"
rx="30"
fill="#000"
opacity="0.12"
filter="url(#shadow)"/>



<!-- NOTEBOOK -->

<rect
x="340"
y="50"
width="920"
height="380"
rx="25"
fill="#FFFFFF"
stroke="#E4D8C5"
stroke-width="3"/>



<!-- SPIRAL -->

<g
stroke="#B7AA98"
stroke-width="4"
fill="none">


<circle cx="420" cy="95" r="8"/>
<circle cx="420" cy="140" r="8"/>
<circle cx="420" cy="185" r="8"/>
<circle cx="420" cy="230" r="8"/>
<circle cx="420" cy="275" r="8"/>
<circle cx="420" cy="320" r="8"/>

</g>



<!-- PAGE LINES -->

<g
stroke="#EEE4D6"
stroke-width="2">


<line x1="430" y1="130" x2="1180" y2="130"/>
<line x1="430" y1="180" x2="1180" y2="180"/>
<line x1="430" y1="230" x2="1180" y2="230"/>
<line x1="430" y1="280" x2="1180" y2="280"/>
<line x1="430" y1="330" x2="1180" y2="330"/>


</g>



<!-- TEXT -->

<text
x="510"
y="165"
font-family="cursive"
font-size="48"
font-weight="700"
fill="#2D2A26"
clip-path="url(#nameClip)">

Tanish Bandodkar

</text>



<text
x="510"
y="225"
font-family="cursive"
font-size="20"
fill="#5C554C"
clip-path="url(#dataClip)">

DATA ANALYTICS

</text>



<text
x="510"
y="265"
font-family="cursive"
font-size="20"
fill="#5C554C"
clip-path="url(#aiClip)">

AI / ML ENTHUSIAST

</text>



<text
x="510"
y="305"
font-family="cursive"
font-size="20"
fill="#5C554C"
clip-path="url(#devClip)">

SOFTWARE DEVELOPER

</text>
