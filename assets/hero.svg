<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
width="1600"
height="500"
viewBox="0 0 1600 500">


<defs>


<!-- BACKGROUND -->

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#FFFDF8"/>
<stop offset="100%" stop-color="#F3EBDD"/>

</linearGradient>



<!-- SHADOW -->

<filter id="shadow">

<feGaussianBlur stdDeviation="14"/>

</filter>



<!--
  ANIMATION TIMELINE  (total = 24 s)
  ─────────────────────────────────────────────────────────────
  Segment   begin   dur   pencil-start-x  pencil-end-x   text
  ─────────────────────────────────────────────────────────────
  Line 1    0.3 s   6 s   510             930            "Tanish Bandodkar"  (48 px font, ~420 px wide)
  pause           0.5 s   (pencil jumps back to col-start of next line)
  Line 2    6.8 s   4 s   510             770            "DATA ANALYTICS"    (22 px font, ~260 px wide)
  pause           0.5 s
  Line 3   11.3 s   4 s   510             840            "AI / ML ENTHUSIAST"(22 px font, ~330 px wide)
  pause           0.5 s
  Line 4   15.8 s   5 s   510             890            "SOFTWARE DEVELOPER" (22 px font, ~380 px wide)
  ─────────────────────────────────────────────────────────────

  Pencil tip = the very front point of the pencil group.
  The pencil group origin IS the tip (polygon "0,0 22,-8 22,8").
  So translate(x, baseline-y) puts the tip at (x, baseline-y).

  Text baselines:
    Line 1  y=165  → we want pencil tip y ≈ 155  (slightly above baseline)
    Line 2  y=220  → pencil tip y ≈ 210
    Line 3  y=265  → pencil tip y ≈ 255
    Line 4  y=310  → pencil tip y ≈ 300

  clipPath rects use the same begin/dur values as pencil x movement.
  rect y and height are set to cover the full glyph ascent/descent.
-->


<!-- TEXT MASKS -->


<clipPath id="nameClip">

  <!-- Line 1: begin=0.3s dur=6s → 0 to 420 px wide -->
  <rect x="510" y="115" width="0" height="58">
    <animate
      attributeName="width"
      from="0"
      to="420"
      begin="0.3s"
      dur="6s"
      fill="freeze"/>
  </rect>

</clipPath>



<clipPath id="dataClip">

  <!-- Line 2: begin=6.8s dur=4s → 0 to 260 px wide -->
  <rect x="510" y="190" width="0" height="38">
    <animate
      attributeName="width"
      from="0"
      to="260"
      begin="6.8s"
      dur="4s"
      fill="freeze"/>
  </rect>

</clipPath>



<clipPath id="aiClip">

  <!-- Line 3: begin=11.3s dur=4s → 0 to 330 px wide -->
  <rect x="510" y="235" width="0" height="38">
    <animate
      attributeName="width"
      from="0"
      to="330"
      begin="11.3s"
      dur="4s"
      fill="freeze"/>
  </rect>

</clipPath>



<clipPath id="devClip">

  <!-- Line 4: begin=15.8s dur=5s → 0 to 380 px wide -->
  <rect x="510" y="280" width="0" height="38">
    <animate
      attributeName="width"
      from="0"
      to="380"
      begin="15.8s"
      dur="5s"
      fill="freeze"/>
  </rect>

</clipPath>

</defs>



