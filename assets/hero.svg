  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" begin="2.8s" dur="3.4s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate"
    values="10 50; 45 40; 80 45; 120 20; 160 10"
