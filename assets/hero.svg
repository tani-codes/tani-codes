<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
width="1600"
height="500"
viewBox="0 0 1600 500">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFFDF8"/>
<stop offset="100%" stop-color="#F3EBDD"/>
</linearGradient>

<filter id="shadow">
<feGaussianBlur stdDeviation="12"/>
</filter>

</defs>


<!-- BACKGROUND -->

<rect
width="1600"
height="500"
fill="url(#bg)"/>


<!-- NOTEBOOK SHADOW -->

<rect
x="390"
y="65"
width="820"
height="330"
rx="25"
fill="#000"
opacity="0.12"
filter="url(#shadow)"/>



<!-- NOTEBOOK -->

<rect
x="380"
y="55"
width="820"
height="320"
rx="25"
fill="#FFFFFF"
stroke="#E4D8C5"
stroke-width="3"/>



<!-- SPIRAL -->

<g stroke="#B7AA98" stroke-width="4" fill="none">

<circle cx="420" cy="95" r="8"/>
<circle cx="420" cy="140" r="8"/>
<circle cx="420" cy="185" r="8"/>
<circle cx="420" cy="230" r="8"/>
<circle cx="420" cy="275" r="8"/>
<circle cx="420" cy="320" r="8"/>

</g>



<!-- PAGE LINES -->

<g stroke="#EEE4D6" stroke-width="2">

<line x1="470" y1="130" x2="1120" y2="130"/>
<line x1="470" y1="175" x2="1120" y2="175"/>
<line x1="470" y1="220" x2="1120" y2="220"/>
<line x1="470" y1="265" x2="1120" y2="265"/>
<line x1="470" y1="310" x2="1120" y2="310"/>

</g>



<!-- NAME -->

<text
