accuracy = 98%

</text>



<!-- AI NETWORK -->

<g
transform="translate(980 255)"
stroke="#5B8DEF"
stroke-width="2">

<line x1="0" y1="0" x2="55" y2="-35"/>
<line x1="0" y1="0" x2="55" y2="35"/>

<line x1="55" y1="-35" x2="120" y2="0"/>
<line x1="55" y1="35" x2="120" y2="0"/>

