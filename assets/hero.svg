    <rect x="-3.5" y="-24" width="7" height="12" rx="1" fill="#4A4A4A" stroke="#222" stroke-width="0.5"/>
    <polygon points="-2.5,-24 2.5,-24 3.5,-75 -3.5,-75" fill="#24292E"/>
    <line x1="0" y1="-24" x2="0" y2="-72" stroke="#5B8DEF" stroke-width="0.8" opacity="0.8"/>
  </g>
</g>

