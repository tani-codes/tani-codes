<?xml version="1.0" encoding="UTF-8"?>
<!--
  hero.svg — Tanish AI Laboratory Hero Banner
  Theme: Dark AI Research Lab + Neural Network Visualization
  Palette: Deep Obsidian (#050816) · Electric Cyan (#00F5FF) · Neon Purple (#8B6FE8) · Mint (#00FF88)
  Author: Tanish Bandodkar
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">

<defs>

  <!-- ── Deep Obsidian Canvas Background ── -->
  <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#050816"/>
    <stop offset="50%"  stop-color="#0A1026"/>
    <stop offset="100%" stop-color="#040612"/>
  </linearGradient>

  <!-- ── Neon Glow Filter ── -->
  <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- ── Glassmorphism Card Shadow ── -->
  <filter id="labShadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00F5FF" flood-opacity="0.18"/>
  </filter>

  <!-- ── Text Mask Clips for Pencil Writing Timeline ── -->
  <clipPath id="nameClip">
    <rect x="510" y="115" width="0" height="58">
      <animate attributeName="width" from="0" to="460" begin="0.3s" dur="6s" fill="freeze"/>
    </rect>
  </clipPath>

  <clipPath id="dataClip">
    <rect x="510" y="190" width="0" height="38">
      <animate attributeName="width" from="0" to="290" begin="6.8s" dur="4s" fill="freeze"/>
    </rect>
  </clipPath>

  <clipPath id="aiClip">
    <rect x="510" y="235" width="0" height="38">
      <animate attributeName="width" from="0" to="340" begin="11.3s" dur="4s" fill="freeze"/>
    </rect>
  </clipPath>

  <clipPath id="devClip">
    <rect x="510" y="280" width="0" height="38">
      <animate attributeName="width" from="0" to="400" begin="15.8s" dur="5s" fill="freeze"/>
    </rect>
  </clipPath>

</defs>

<!-- ══════════════════════════════════════════ -->
<!--  DARK OBSIDIAN BACKGROUND                  -->
<!-- ══════════════════════════════════════════ -->
<rect width="1600" height="500" fill="url(#heroBg)"/>

<!-- Tech Grid Background -->
<g stroke="#14213D" stroke-width="0.8" opacity="0.4">
  <line x1="0" y1="100" x2="1600" y2="100"/>
  <line x1="0" y1="250" x2="1600" y2="250"/>
  <line x1="0" y1="400" x2="1600" y2="400"/>
  <line x1="300" y1="0" x2="300" y2="500"/>
  <line x1="800" y1="0" x2="800" y2="500"/>
  <line x1="1300" y1="0" x2="1300" y2="500"/>
</g>

<!-- Floating Synapse Particles & Neural Lines -->
<g stroke="#00D2FF" stroke-width="1" opacity="0.3">
  <line x1="200" y1="120" x2="350" y2="80" stroke-dasharray="4,4"/>
  <line x1="1350" y1="400" x2="1480" y2="340" stroke-dasharray="4,4"/>
</g>

<circle cx="200" cy="120" r="4" fill="#00F5FF" filter="url(#neonGlow)">
  <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="1480" cy="340" r="4" fill="#8B6FE8" filter="url(#neonGlow)">
  <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
</circle>

<!-- ══════════════════════════════════════════ -->
<!--  GLASSMORPHISM LABORATORY CARD             -->
<!-- ══════════════════════════════════════════ -->
<rect x="330" y="40" width="950" height="390" rx="18" fill="#0D1730" opacity="0.9" stroke="#00F5FF" stroke-width="1.5" filter="url(#labShadow)"/>

<!-- Top Card Status Header -->
<g transform="translate(360, 60)">
  <rect width="180" height="24" rx="6" fill="#05261E" stroke="#00FF88" stroke-width="0.8"/>
  <circle cx="12" cy="12" r="3.5" fill="#00FF88">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="24" y="16" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" fill="#00FF88" letter-spacing="1">SYSTEM: ONLINE</text>
</g>

<!-- Left Margin & Ruled Lines -->
<line x1="480" y1="50" x2="480" y2="420" stroke="#00F5FF" stroke-width="1.2" opacity="0.4"/>
<g stroke="#1A284A" stroke-width="0.8" opacity="0.6">
  <line x1="490" y1="165" x2="1250" y2="165"/>
  <line x1="490" y1="220" x2="1250" y2="220"/>
  <line x1="490" y1="265" x2="1250" y2="265"/>
  <line x1="490" y1="310" x2="1250" y2="310"/>
</g>

<!-- ══════════════════════════════════════════ -->
<!--  TEXT CONTENT                              -->
<!-- ══════════════════════════════════════════ -->
<!-- Line 1: Name -->
<text x="510" y="155" font-family="'Courier New', monospace" font-size="44" font-weight="800" fill="#00F5FF" filter="url(#neonGlow)" clip-path="url(#nameClip)">
  TANISH BANDODKAR
</text>

<!-- Line 2: Subtitle 1 -->
<text x="510" y="210" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#8B6FE8" letter-spacing="1" clip-path="url(#dataClip)">
  DATA ANALYTICS &amp; BI
</text>

<!-- Line 3: Subtitle 2 -->
<text x="510" y="255" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#00D2FF" letter-spacing="1" clip-path="url(#aiClip)">
  AI AUTOMATION &amp; WORKFLOWS
</text>

<!-- Line 4: Subtitle 3 -->
<text x="510" y="300" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#00FF88" letter-spacing="1" clip-path="url(#devClip)">
  SOFTWARE ENGINEERING
</text>

<!-- ══════════════════════════════════════════ -->
<!--  RIGHT SIDE LAB WIDGETS                    -->
<!-- ══════════════════════════════════════════ -->

<!-- Code Card -->
<rect x="1050" y="90" width="200" height="95" rx="10" fill="#070E20" stroke="#1E2E52" stroke-width="1.2"/>
<text x="1068" y="125" font-family="'Courier New', monospace" font-size="13" fill="#00F5FF">model.fit(data)</text>
<text x="1068" y="152" font-family="'Courier New', monospace" font-size="13" fill="#00FF88">accuracy = 98.4%</text>

<!-- AI Neural Network -->
<g transform="translate(1110 240)" stroke="#00D2FF" stroke-width="1.5">
  <line x1="0" y1="0" x2="55" y2="-30"/>
  <line x1="0" y1="0" x2="55" y2="30"/>
  <line x1="55" y1="-30" x2="110" y2="0"/>
  <line x1="55" y1="30"  x2="110" y2="0"/>
  <circle cx="0"   cy="0"   r="8" fill="#8B6FE8"/>
  <circle cx="55"  cy="-30" r="7" fill="#00F5FF"/>
  <circle cx="55"  cy="30"  r="7" fill="#00F5FF"/>
  <circle cx="110" cy="0"   r="9" fill="#00FF88"/>
</g>

<!-- Live Line Graph -->
<g transform="translate(1070 340)">
  <polyline points="10,50 45,40 80,45 120,20 160,10" fill="none" stroke="#00F5FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="10" r="4" fill="#00FF88" filter="url(#neonGlow)"/>
</g>

<!-- ══════════════════════════════════════════ -->
<!--  PENCIL WRITING ANIMATION (Pencil Tip)      -->
<!-- ══════════════════════════════════════════ -->
<g>
  <animateTransform attributeName="transform" type="translate"
    values="
      510 155; 970 155; 510 210; 800 210; 510 255; 850 255; 510 300; 910 300; 910 300
    "
    keyTimes="
      0; 0.25; 0.2833; 0.45; 0.4708; 0.6375; 0.6583; 0.8667; 1
    "
    dur="24s" fill="freeze"/>
  
  <g transform="rotate(-35)">
    <polygon points="0,0 22,-8 22,8" fill="#00F5FF"/>
    <polygon points="0,0 7,-2.5 7,2.5" fill="#FFF"/>
    <rect x="22" y="-8" width="120" height="16" fill="#8B6FE8"/>
    <rect x="142" y="-8" width="15" height="16" fill="#00D2FF"/>
    <rect x="157" y="-8" width="20" height="16" rx="3" fill="#00FF88"/>
  </g>
</g>

</svg>