<?xml version="1.0" encoding="UTF-8"?>
<!--
  splash.svg — Minimal Cyber Gradient Section Divider
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24">
<defs>

  <linearGradient id="divGlow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#00F5FF" stop-opacity="0.0"/>
    <stop offset="25%"  stop-color="#00F5FF" stop-opacity="0.4"/>
    <stop offset="50%"  stop-color="#8B6FE8" stop-opacity="0.75"/>
    <stop offset="75%"  stop-color="#00D2FF" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.0"/>
  </linearGradient>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- Center Sleek Gradient Divider Line -->
<rect x="80" y="11" width="740" height="1.5" rx="0.75" fill="url(#divGlow)" filter="url(#softGlow)"/>

<!-- Minimal Center Pulse Orb -->
<circle cx="450" cy="12" r="3" fill="#00F5FF" filter="url(#softGlow)">
  <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  <animate attributeName="r" values="2.5;3.5;2.5" dur="2.5s" repeatCount="indefinite"/>
</circle>
<circle cx="450" cy="12" r="1.2" fill="#FFFFFF"/>

</svg>
