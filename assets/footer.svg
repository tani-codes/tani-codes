<?xml version="1.0" encoding="UTF-8"?>
<!--
  footer.svg — Tanish AI Laboratory Footer Banner
  Theme: Dark Obsidian Glassmorphism + Cyber Neon Accents + Signature Quote
  Palette: Deep Obsidian (#050816) · Neon Cyan (#00F5FF) · Electric Purple (#8B6FE8) · Mint (#00FF88)
  Author: Tanish Bandodkar
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="220" viewBox="0 0 1600 220">

<defs>

  <!-- ── Deep Obsidian Canvas Background ── -->
  <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#050816"/>
    <stop offset="50%"  stop-color="#0A1028"/>
    <stop offset="100%" stop-color="#030510"/>
  </linearGradient>

  <!-- ── Electric Cyan / Purple Border Gradient ── -->
  <linearGradient id="footerBorderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#00F5FF" stop-opacity="0.8"/>
    <stop offset="50%"  stop-color="#8B6FE8" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.8"/>
  </linearGradient>

  <!-- ── Neon Cyan Blur ── -->
  <filter id="footerNeonBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- ── Glassmorphism Drop Shadow ── -->
  <filter id="footerGlassShadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#00F5FF" flood-opacity="0.12"/>
  </filter>

</defs>

<!-- ══════════════════════════════════════════ -->
<!--  BACKGROUND CANVAS                         -->
<!-- ══════════════════════════════════════════ -->
<rect width="1600" height="220" fill="url(#footerBg)" rx="16"/>

<!-- Cybernetic Grid Overlay -->
<g stroke="#14213D" stroke-width="0.7" opacity="0.30">
  <line x1="0" y1="50"  x2="1600" y2="50"/>
  <line x1="0" y1="110" x2="1600" y2="110"/>
  <line x1="0" y1="170" x2="1600" y2="170"/>
  <line x1="300" y1="0" x2="300" y2="220"/>
  <line x1="800" y1="0" x2="800" y2="220"/>
  <line x1="1300" y1="0" x2="1300" y2="220"/>
</g>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  CENTERED SPACIOUS GLASSMORPHISM PANEL                         -->
<!-- ══════════════════════════════════════════════════════════════ -->
<g transform="translate(250, 30)" filter="url(#footerGlassShadow)">
  <!-- Outer Glass Frame -->
  <rect width="1100" height="160" rx="14" fill="#0B132B" fill-opacity="0.85" stroke="url(#footerBorderGlow)" stroke-width="1.5"/>

  <!-- Corner Tech Accents -->
  <path d="M10,0 L24,0 M0,10 L0,24" stroke="#00F5FF" stroke-width="2" fill="none"/>
  <path d="M1090,0 L1076,0 M1100,10 L1100,24" stroke="#00F5FF" stroke-width="2" fill="none"/>
  <path d="M10,160 L24,160 M0,150 L0,136" stroke="#00F5FF" stroke-width="2" fill="none"/>
  <path d="M1090,160 L1076,160 M1100,150 L1100,136" stroke="#00F5FF" stroke-width="2" fill="none"/>

  <!-- Glowing Pulsing Synapses (Left & Right) -->
  <circle cx="50" cy="80" r="5" fill="#00FF88" filter="url(#footerNeonBlur)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="80" r="5" fill="#00F5FF" filter="url(#footerNeonBlur)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ══════════════════════════════════════════ -->
  <!--  FOOTER TYPOGRAPHY                         -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Subtitle / Signature -->
  <text x="550" y="78"
        font-family="'Segoe UI', sans-serif"
        font-size="16" font-weight="700"
        fill="#00F5FF" text-anchor="middle"
        letter-spacing="2">
    TANISH BANDODKAR <tspan fill="#8B6FE8">•</tspan> SOFTWARE DEVELOPER <tspan fill="#8B6FE8">•</tspan> ML / DL ENGINEER
  </text>

  <!-- Bottom Copyright / System Tag -->
  <text x="550" y="116"
        font-family="'Courier New', Courier, monospace"
        font-size="11.5"
        fill="#5C6B80" text-anchor="middle"
        letter-spacing="1.5">
    DESIGNED &amp; ENGINEERED BY TANISH BANDODKAR © 2026
  </text>

</g>

<!-- ══════════════════════════════════════════════════════════════ -->
<!--  BOTTOM CYBER WAVE FLOOR                                       -->
<!-- ══════════════════════════════════════════════════════════════ -->
<path d="M0,195 Q400,225 800,195 Q1200,165 1600,195 L1600,220 L0,220 Z" fill="#070D1F" opacity="0.9"/>

</svg>
